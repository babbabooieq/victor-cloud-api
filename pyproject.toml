[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victor-cloud-api"
version = "0.1.0"
description = "VICTOR Recon cloud API - accounts, sessions, findings, and the collector wire protocol. Closed source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.18",
    "boto3>=1.34",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/victor_cloud_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
